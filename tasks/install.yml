---
# tasks file for role_proxmox

- name: Install Proxmox Packages
  include_tasks: packages_install.yml

- name: Configure PVE Groups
  include_tasks: setup_groups.yml
  when: proxmox_groups is defined

- name: Configure PVE and System Users
  include_tasks: setup_users.yml
  when: proxmox_users is defined

- name: Configure storage
  include_tasks: setup_storage.yml
  when: proxmox_storage is defined

- name: Configure network interfaces
  include_tasks: setup_network.yml
  when: proxmox_network_interfaces is defined

- name: Get API Tokens
  include_tasks: setup_tokens.yml
  when: proxmox_users is defined

- name: Download ISO Files
  include_tasks: download.yml
  when:
    - proxmox_iso_path is defined
    - proxmox_iso_files is defined
