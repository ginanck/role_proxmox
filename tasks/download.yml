---
- name: Install screen package
  ansible.builtin.apt:
    name: screen
    state: present
    update_cache: true

- name: Generate ISO download script
  ansible.builtin.template:
    src: download.sh.j2
    dest: "{{ proxmox_iso_path }}/download.sh"
    mode: '0755'

- name: Start download script in screen session
  ansible.builtin.shell: |
    screen -dmS iso_download bash -c "{{ proxmox_iso_path }}/download.sh"
  args:
    executable: /bin/bash
