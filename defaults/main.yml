  #   path: /data
  #   content: ['rootdir', 'iso', 'images']
  #   state: present

# Repository keys to add
# url: https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg
proxmox_apt_keys:
  url: "https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg"
  state: present

proxmox_repositories:
  repo: "deb [arch=amd64] http://download.proxmox.com/debian/pve bookworm pve-no-subscription"
  filename: "pve-install-repo.list"
  state: present

proxmox_enterprise_repositories:
  repo: "deb https://enterprise.proxmox.com/debian/pve bookworm pve-enterprise"
  filename: "pve-enterprise"
  state: absent

proxmox_dependencies:
  - sudo
  - openssh-server
  - postfix
  - open-iscsi
  - curl
  - software-properties-common
  - apt-transport-https
  - ca-certificates
  - gnupg2

proxmox_packages:
  kernel: proxmox-default-kernel
  proxmox:
    - proxmox-ve
    - postfix
    - open-iscsi
    - chrony

proxmox_services:
  - pve-cluster
  - pvedaemon
  - pveproxy
  - pvestatd

proxmox_iso_download: true
proxmox_iso_path: "/data/template/iso"
